# Judge0 CE stack (separate from app Postgres/Redis in docker-compose.yml).
# Start: docker compose -f docker-compose.judge0.yml up -d
# API:   http://localhost:2358
#
# Requires Docker with privileged containers (isolate sandbox).
# On Windows/macOS, Rails callbacks use host.docker.internal (see .env.example).
# Docker Desktop (cgroup v2): judge0.conf enables per-process setrlimit limits
# instead of isolate --cg (sandbox still uses isolate).

name: thetarush-judge0

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: thetarush_judge0_server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    privileged: true
    cgroup: host
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - judge0_net

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: thetarush_judge0_workers
    command: [ "./scripts/workers" ]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    cgroup: host
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - judge0_net

  judge0-db:
    image: postgres:16.2-alpine
    container_name: thetarush_judge0_db
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0local
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U judge0 -d judge0" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - judge0_net

  judge0-redis:
    image: redis:7.2.4-alpine
    container_name: thetarush_judge0_redis
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "judge0redis" ]
    volumes:
      - judge0_redisdata:/data
    restart: unless-stopped
    networks:
      - judge0_net

volumes:
  judge0_pgdata:
  judge0_redisdata:

networks:
  judge0_net:
    driver: bridge
