# Minimal Judge0 CE config for local ThetaRush development.
# Used by docker-compose.judge0.yml. Do not put production secrets here.

REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0redis

POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0local

MAINTENANCE_MODE=false
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_CALLBACKS=true
ENABLE_SUBMISSION_DELETE=true
ENABLE_BATCHED_SUBMISSIONS=true
MAX_SUBMISSION_BATCH_SIZE=20

# Use isolate setrlimit instead of cgroup memory/time (needed on Docker Desktop cgroup v2).
# Isolate sandbox remains enabled; only the resource-limit backend changes.
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true


# Allow callbacks to host Rails on Windows/macOS Docker Desktop.
# Rails must listen on 0.0.0.0:3000 for host.docker.internal to reach it.
